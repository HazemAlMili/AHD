map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Laravel's API is handled by the PHP-FPM container; the browser sees one origin.
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass app:9000;
    }

    # The public Laravel disk is mounted read-only into Nginx. Private storage is not mounted.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Vite serves the React app, source files, and HMR websocket in development.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Never proxy repository secrets or Laravel internals to the browser.
    location ~ /(?:\.env|\.git|vendor/|storage/app/private/) {
        deny all;
        return 404;
    }
}
